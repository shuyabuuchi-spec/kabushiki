name: Monitor JP Stocks & Multi-Pattern Simulator (PC OFF)

on:
  schedule:
    # 東証の取引時間（JST 09:00〜15:30 = UTC 00:00〜06:30、月〜金）に10分間隔で全有効パターンを並行実行
    # Publicリポジトリなら完全無料・無制限（他のPrivateリポジトリの無料枠には一切影響しません）
    - cron: "*/10 0-6 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "東証の取引時間外でも強制実行する"
        required: false
        default: "true"
        type: boolean
      reset_pattern:
        description: "初期資金でリセットするパターンID（空欄=リセットなし / all=全リセット）"
        required: false
        default: ""
        type: string
      collect_ml:
        description: "外部マクロ＋長期60mデータを再収集してMLモデルを再学習する"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: kabushiki-simulator
  cancel-in-progress: false

jobs:
  monitor-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decrypt simulation DB if passphrase secret is configured
        env:
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
        run: |
          if [ -n "$DASHBOARD_PASSPHRASE" ]; then
            python -m kabushiki.runner decrypt-state
          fi

      - name: Optional pattern reset or ML data collection
        env:
          RESET_PATTERN: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_pattern || '' }}
          COLLECT_ML: ${{ github.event_name == 'workflow_dispatch' && inputs.collect_ml || 'false' }}
        run: |
          if [ -n "$RESET_PATTERN" ]; then
            python -m kabushiki.runner reset --pattern "$RESET_PATTERN"
          fi
          if [ "$COLLECT_ML" = "true" ]; then
            python -m kabushiki.runner collect-ml-data --days 55
          fi

      - name: Run parallel catch-up monitor & simulation for all enabled patterns
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run || 'false' }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            python -m kabushiki.runner catchup --pattern all --days 5
          else
            python -m kabushiki.runner catchup --pattern all --days 5 --only-when-open
          fi

      - name: Encrypt state & commit updated simulation data
        env:
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
        run: |
          git config user.name "kabushiki-bot"
          git config user.email "kabushiki-bot@users.noreply.github.com"

          if [ -n "$DASHBOARD_PASSPHRASE" ]; then
            python -m kabushiki.runner encrypt-state --remove-plaintext
            git rm -f --ignore-unmatch data/kabushiki.db data/dashboard_snapshot.json web/data/dashboard_snapshot.json || true
            git add -f data/kabushiki.db.enc web/data/dashboard_snapshot.enc.json
          else
            git add -f data/kabushiki.db data/dashboard_snapshot.json web/data/dashboard_snapshot.json
          fi

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore(sim): update multi-pattern JP stock simulation"

          # Retry push safely if another run committed in between
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push conflict on attempt $attempt; rebasing and retrying..."
            git pull --rebase origin main || exit 1
          done
          exit 1
