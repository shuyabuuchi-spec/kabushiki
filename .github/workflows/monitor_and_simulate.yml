name: Monitor JP Stocks & Multi-Pattern Simulator (PC OFF)

on:
  schedule:
    # 東証の取引時間（JST 09:00〜15:30 = UTC 00:00〜06:30、月〜金）に10分間隔で全有効パターンを並行実行
    # Publicリポジトリなら完全無料・無制限（他のPrivateリポジトリの無料枠には一切影響しません）
    - cron: "*/10 0-6 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "東証の取引時間外でも強制実行する"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

concurrency:
  group: kabushiki-simulator
  cancel-in-progress: false

jobs:
  monitor-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parallel catch-up monitor & simulation for all enabled patterns
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run || 'false' }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            python -m kabushiki.runner catchup --pattern all --days 5
          else
            python -m kabushiki.runner catchup --pattern all --days 5 --only-when-open
          fi

      - name: Commit updated simulation state & dashboard snapshot
        run: |
          git config user.name "kabushiki-bot"
          git config user.email "kabushiki-bot@users.noreply.github.com"
          git add data/kabushiki.db data/dashboard_snapshot.json web/data/dashboard_snapshot.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(sim): update multi-pattern JP stock simulation"
            git push
          fi
